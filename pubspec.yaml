name: subscript
description: SubScript - a premium, local-first subscription tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (pinned to 2.x: StateNotifier is first-class here)
  flutter_riverpod: ^2.6.1

  # Local storage (maintained Isar 3 fork, drop-in API)
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Notifications (pinned to 19.x: positional initialize/zonedSchedule API)
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.0

flutter:
  uses-material-design: true